# Build the node image and the node Helm chart from any branch, to test them on a
# real cluster before a release. Publishes to the GitHub Container Registry of the
# repository owner (the vantage6 organization or the owner of a fork). Never moves
# release tags such as `latest` or `uluru`, never commits, never publishes to PyPI.
#
# Start it by pushing a tag `build/<tag>`, or from the Actions tab. The image becomes
# ghcr.io/<owner>/infrastructure/node:<tag>, the chart
# oci://ghcr.io/<owner>/helm/node with version <chart version>-<tag>.
name: Test build

on:
  push:
    tags:
      - "build/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (letters, digits, '.', '_' and '-')"
        required: true
      platforms:
        description: "Platforms to build the image for"
        required: true
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  node:
    name: Build node image and chart
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag and registry
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${REF_NAME#build/}}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid tag '$TAG'" >&2
            exit 1
          fi
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$OWNER_LC/infrastructure" >> "$GITHUB_OUTPUT"
          echo "helm_registry=oci://ghcr.io/$OWNER_LC/helm" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        # pinned to: https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        if: ${{ steps.meta.outputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push node image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
        run: make image TAG="$TAG" REGISTRY="$REGISTRY" PLATFORMS="$PLATFORMS" PUSH_REG=true

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.4

      - name: Check node chart
        run: |
          pip install pyyaml
          python charts/node/tests/check_render.py

      - name: Package and push node chart
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          HELM_REGISTRY: ${{ steps.meta.outputs.helm_registry }}
        run: |
          set -euo pipefail
          CHART_VERSION=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/node/Chart.yaml)
          # SemVer pre-release identifiers only allow letters, digits, '-' and '.'
          VERSION="${CHART_VERSION}-$(echo "$TAG" | tr '_' '-')"
          helm dependency update charts/node
          helm package charts/node --version "$VERSION" --destination dist
          helm push "dist/node-${VERSION}.tgz" "$HELM_REGISTRY"
          {
            echo "### Node test build"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.registry }}/node:${TAG}\`"
            echo "- Chart: \`${HELM_REGISTRY}/node\` version \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
