# Scan container images for vulnerabilities with Trivy, weekly and on demand.
# Without input, all tags in docker/maintained-images.toml are scanned; with an
# image reference, only that image.
# Results end up in the job summary (HIGH/CRITICAL), the Security tab (SARIF,
# one category per image and tag) and a JSON artifact (everything). A full scan
# also removes the results of tags that are no longer maintained.
#
# CVEs that Docker has marked as not exploitable in its Hardened Images are
# suppressed through VEX. This only affects the DHI-based images mirrored via
# docker/mirror-images.txt for now; the other images will be included once there
# base images are also DHI images.
name: Container scan
on:
  schedule:
    # Every Sunday at 03:00 UTC: a full scan of all maintained images
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to scan, e.g. ghcr.io/vantage6/infrastructure/hq:latest (leave empty to scan all maintained images)"
        required: false
        type: string
  # Called by release.yml to scan the images it just published. These results
  # are only reported in the job summary and as artifacts: they reach the
  # Security tab once the release is added to docker/maintained-images.toml.
  workflow_call:
    inputs:
      images:
        description: Image references to scan, separated by whitespace
        required: true
        type: string

permissions:
  contents: read

jobs:
  targets:
    name: List images
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List images to scan
        id: targets
        env:
          IMAGES: ${{ inputs.images || inputs.image }}
        run: |
          if [ -n "$IMAGES" ]; then
            targets=$(for image in $IMAGES; do
              name="${image##*/}"
              name="${name%%@*}"
              jq -nc --arg image "$image" --arg category "${name/:/-}" \
                '{image: $image, category: $category}'
            done | jq -sc .)
          else
            targets=$(python3 tools/maintained-images.py)
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # Download the Trivy binary and the vulnerability databases once and share
      # them with the scan jobs through the cache, instead of letting every job
      # download them. The binary is cached per version, so keep the versions of
      # both Install Trivy steps the same.
      - name: Install Trivy
        # pinned to: https://github.com/aquasecurity/setup-trivy/releases/tag/v0.3.1
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
          cache: true

      - name: Download vulnerability databases
        run: |
          trivy image --download-db-only
          trivy image --download-java-db-only

      - name: Cache vulnerability databases
        # pinned to: https://github.com/actions/cache/releases/tag/v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ github.run_id }}

  scan:
    name: ${{ matrix.target.category }}
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      IMAGE: ${{ matrix.target.image }}
      TRIVY_SKIP_DB_UPDATE: true
      TRIVY_SKIP_JAVA_DB_UPDATE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        # pinned to: https://github.com/docker/login-action/releases/tag/v4.1.0
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Trivy
        # pinned to: https://github.com/aquasecurity/setup-trivy/releases/tag/v0.3.1
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
          cache: true

      - name: Restore vulnerability databases
        # pinned to: https://github.com/actions/cache/releases/tag/v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Configure VEX repositories
        run: |
          mkdir -p ~/.trivy/vex
          cat > ~/.trivy/vex/repository.yaml << 'EOF'
          repositories:
            - name: default
              url: https://github.com/aquasecurity/vexhub
              enabled: true
            - name: dhi-vex
              url: https://github.com/docker-hardened-images/advisories
              enabled: true
          EOF
          trivy vex repo download

      - name: Scan image
        run: trivy image --scanners vuln --vex repo --format json
          --output report.json "$IMAGE"

      - name: Write job summary
        run: |
          {
            echo "## $IMAGE"
            echo '```'
            trivy convert --format table --severity HIGH,CRITICAL report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert to SARIF
        run: trivy convert --format sarif --output report.sarif report.json

      - name: Upload to Security tab
        if: inputs.images == ''
        # pinned to: https://github.com/github/codeql-action/releases/tag/v4.39.0
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          sarif_file: report.sarif
          category: ${{ matrix.target.category }}

      - name: Upload report
        # pinned to: https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-${{ matrix.target.category }}
          path: report.json

  # Delete the Trivy analyses, and with them the alerts, of categories that are
  # no longer in docker/maintained-images.toml. Only on a full scan: a scan of
  # given images lists only those categories, so everything else would be
  # deleted.
  cleanup:
    name: Remove unmaintained images
    needs: targets
    if: >-
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.image == '')) &&
      needs.targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Delete analyses of removed categories
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.targets.outputs.targets }}
        run: |
          keep=$(jq -r '.[].category' <<< "$TARGETS")
          # Each set of analyses (ref + tool + category) has exactly one deletable
          # analysis: the most recent. Deleting it returns the next one in the set,
          # so follow confirm_delete_url until the set is gone.
          gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
            -f tool_name=Trivy -f ref="$GITHUB_REF" -f per_page=100 \
            --jq '.[] | select(.deletable) | "\(.id) \(.category)"' |
          while read -r id category; do
            if grep -qxF "$category" <<< "$keep"; then
              continue
            fi
            echo "Deleting analyses of category $category"
            url="repos/$GITHUB_REPOSITORY/code-scanning/analyses/$id?confirm_delete=true"
            while [ -n "$url" ]; do
              url=$(gh api --method DELETE "$url" --jq '.confirm_delete_url // empty')
              url="${url#https://api.github.com/}"
            done
          done
