{{- if and (not .Values.node.createSecrets) (or .Values.node.private_docker_registries .Values.node.algorithm_env) }}
{{- fail "node.private_docker_registries and node.algorithm_env cannot be set when node.createSecrets is false: add them to your node secret as V6_PRIVATE_DOCKER_REGISTRIES and V6_ALGORITHM_ENV (JSON) instead" }}
{{- end }}
{{- if .Values.node.createSecrets }}
  {{- $databases := concat (.Values.node.databases.fileBased | default list) (.Values.node.databases.serviceBased | default list) }}
  {{- $databaseNames := list }}
  {{- range $db := $databases }}
  {{- $databaseNames = append $databaseNames $db.name }}
  {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  {{- if .Values.node.apiKey }}
  V6_API_KEY: {{ .Values.node.apiKey | b64enc }}
  {{- end }}
  V6_NODE_NAME: {{ .Values.node.name | b64enc }}
  DATABASE_LABELS: {{ join "," $databaseNames | b64enc }}
  {{- if .Values.node.private_docker_registries }}
  V6_PRIVATE_DOCKER_REGISTRIES: {{ .Values.node.private_docker_registries | toJson | b64enc }}
  {{- end }}
  {{- if .Values.node.algorithm_env }}
  V6_ALGORITHM_ENV: {{ .Values.node.algorithm_env | toJson | b64enc }}
  {{- end }}
  {{- range $db := $databases }}
  {{- $envLabel := include "node.databaseEnvLabel" (dict "databaseName" $db.name) }}
  {{- if $db.uri }}
  DATABASE_{{ $envLabel }}_URI: {{ $db.uri | b64enc }}
  {{- end }}
  DATABASE_{{ $envLabel }}_TYPE: {{ $db.type | b64enc }}
  {{- if $db.env }}
  {{- range $key, $value := $db.env }}
  DATABASE_{{ $envLabel }}_{{ $key | upper }}: {{ $value | b64enc }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}