apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-create-tasks-role
  namespace: {{ include "node.namespace" . }}
  labels:
{{- include "node.labels" . | nindent 4 }}
rules:
# Algorithms run as Kubernetes jobs, which the node starts, watches and removes.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Pods of algorithm runs: status, logs, clean-up, and the startup permission and
# network isolation checks.
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Secrets that pass sensitive environment variables and registry credentials to
# algorithm runs.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete", "get", "list", "watch"]
