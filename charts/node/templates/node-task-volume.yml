{{- /* Development only: task files in a directory on one machine. */}}
{{- if and (include "node.tasksStatic" .) (not (lookup "v1" "PersistentVolume" "" (printf "%s-task-pv" .Release.Name))) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-task-pv
  labels:
    type: local-tasks
spec:
  capacity:
    storage: {{ .Values.node.persistence.tasks.size }}
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.node.persistence.tasks.storageClass | default "local-storage" }}
  persistentVolumeReclaimPolicy: Retain
  local:
    path: {{ .Values.node.persistence.tasks.hostPath | quote }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ required "node.k8sNodeName is required with persistence.tasks.hostPath" .Values.node.k8sNodeName }}
{{- end }}
