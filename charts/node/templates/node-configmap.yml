apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ include "node.namespace" . }}
data:
  config.yml: |
    hq_url: {{ .Values.node.hq.url }}
    api_path: {{ .Values.node.hq.path }}
    port: {{ .Values.node.hq.port }}
    node_proxy_port: {{ .Values.node.proxyPort }}
    task_namespace: {{ include "node.namespace" . }}
    release_name: {{ .Release.Name }}
    task_storage:
      claim_name: {{ include "node.taskClaimName" . }}
      sub_path: {{ .Values.node.persistence.tasks.subPath | default "" | quote }}
      {{- /* Host path volumes already pin every pod that uses them to one machine. */}}
      colocate_with_node: {{ and (not (include "node.tasksStatic" .)) (eq .Values.node.persistence.tasks.accessMode "ReadWriteOnce") }}
    node_pod_labels:
{{ include "node.podLabels" . | indent 6 }}
    {{- with .Values.node.algorithmPods }}
    algorithm_pods:
      {{- with .resources }}
      resources:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if not (kindIs "invalid" .ttlSecondsAfterFinished) }}
      ttl_seconds_after_finished: {{ .ttlSecondsAfterFinished }}
      {{- end }}
      {{- with .serviceAccountName }}
      service_account_name: {{ . }}
      {{- end }}
      {{- with .runtimeClassName }}
      runtime_class_name: {{ . }}
      {{- end }}
      {{- with .podSecurityContext }}
      pod_security_context:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .securityContext }}
      security_context:
{{ toYaml . | indent 8 }}
      {{- end }}
    {{- end }}
    network_isolation:
      verify: {{ .Values.node.networkPolicy.verifyIsolation }}
      probe_image: {{ include "common.supportImage" (dict "Chart" .Chart "name" "curl" "override" .Values.node.networkPolicy.probeImage) }}
    production: {{ .Values.node.production }}
    share_config: {{ .Values.node.share_config }}
    share_algorithm_logs: {{ .Values.node.share_algorithm_logs }}
    allow_http_polling: {{ .Values.node.allow_http_polling | default false }}
    encryption:
      enabled: {{ .Values.node.encryption.enabled }}
    logging:
      backup_count: {{ .Values.node.logging.backup_count }}
      datefmt: {{ .Values.node.logging.datefmt | quote }}
      file: {{ .Values.node.logging.file }}
      format: {{ .Values.node.logging.format | quote }}
      level: {{ .Values.node.logging.level }}
      max_size: {{ .Values.node.logging.max_size }}
      use_console: {{ .Values.node.logging.use_console }}
      {{- if .Values.node.logging.loggers }}
      loggers:
      {{- range .Values.node.logging.loggers }}
      - level: {{ .level }}
        name: {{ .name }}
      {{- end }}
      {{- end }}
    policies:
      {{- if .Values.node.policies.allowed_algorithms }}
      allowed_algorithms:
        {{- range .Values.node.policies.allowed_algorithms }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.node.policies.allowed_algorithm_stores }}
      allowed_algorithm_stores:
        {{- range .Values.node.policies.allowed_algorithm_stores }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.node.policies.allowed_users }}
      allowed_users:
        {{- range .Values.node.policies.allowed_users }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.node.policies.allowed_organizations }}
      allowed_organizations:
        {{- range .Values.node.policies.allowed_organizations }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      require_algorithm_pull: {{ .Values.node.policies.require_algorithm_pull }}
      allow_either_whitelist_or_store: {{ .Values.node.policies.allow_either_whitelist_or_store }}
    prometheus:
      enabled: {{ .Values.node.prometheus.enabled }}
      {{- if .Values.node.prometheus.enabled }}
      report_interval_seconds: {{ .Values.node.prometheus.report_interval_seconds | default 60 }}
      {{- end }}
    {{- if .Values.node.private_docker_registries }}
    private_docker_registries:
      {{- range .Values.node.private_docker_registries }}
      - registry: {{ .registry }}
        username: {{ .username }}
        password: {{ .password | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.node.debug }}
    debug:
      socketio: {{ .Values.node.debug.socketio }}
      proxy_server: {{ .Values.node.debug.proxy_server }}
    {{- end }}
    {{- if .Values.node.dev }}
    {{- if .Values.node.dev.task_dir_extension }}
    dev:
      task_dir_extension: {{ .Values.node.dev.task_dir_extension }}
    {{- end }}
    {{- end }}
    {{- if .Values.node.algorithm_env }}
    algorithm_env:
      {{- range $key, $value := .Values.node.algorithm_env }}
      {{ $key }}: {{ $value }}
      {{- end }}
    {{- end }}