apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ include "node.namespace" . }}
  labels:
{{ include "node.labels" . | indent 4 }}
    component: node
spec:
  # Never run two instances: a ReadWriteOnce task volume cannot follow a new pod to
  # another machine while the old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "node.matchLabels" . | indent 6 }}
      component: node
  template:
    metadata:
      labels:
{{ include "node.labels" . | indent 8 }}
        component: node
    spec:
      {{- include "common.imagePullSecrets" (dict "Values" .Values "indent" 6) }}
      serviceAccountName: {{ include "node.serviceAccountName" . }}
      {{- with .Values.node.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.node.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: vantage6-node
        image: {{ .Values.node.image | default "ghcr.io/vantage6/infrastructure/node:uluru" }}
        imagePullPolicy: {{ .Values.node.imagePullPolicy | default "Always" }}
        {{- with .Values.node.resources }}
        resources:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.node.securityContext }}
        securityContext:
{{ toYaml . | indent 10 }}
        {{- end }}
        env:
        - name: V6_PROXY_PORT
          value: "{{ .Values.node.proxyPort }}"
        - name: V6_PROXY_HOST
          value: http://{{ .Release.Name }}.{{ include "node.namespace" . }}.svc.cluster.local
        - name: KEYCLOAK_URL
          value: {{ .Values.node.keycloak.url | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.node.keycloak.realm | quote }}
        {{- if .Values.node.k8sNodeName }}
        - name: V6_K8S_NODE_NAME
          value: {{ .Values.node.k8sNodeName | quote }}
        {{- end }}
        {{- range .Values.node.databases.fileBased }}
        {{- $envLabel := include "node.databaseEnvLabel" (dict "databaseName" .name) }}
        - name: DATABASE_{{ $envLabel }}_MOUNT_MODE
          value: {{ default "ro" .mount_mode | quote }}
        - name: DATABASE_{{ $envLabel }}_CLAIM_NAME
          value: {{ include "node.databaseClaimName" (dict "releaseName" $.Release.Name "db" .) | quote }}
        - name: DATABASE_{{ $envLabel }}_SUB_PATH
          value: {{ include "node.databaseSubPath" (dict "db" .) | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-secrets
        command: ["vnode-local", "start", "-c", "/app/config/config.yml"]
        volumeMounts:
        - name: task-files-root
          mountPath: /app/tasks
          {{- with .Values.node.persistence.tasks.subPath }}
          subPath: {{ . }}
          {{- end }}
        # Single-file mount (like Docker: `/mnt/config/<name>.yaml` only), not whole dir
        - name: config-volume
          mountPath: /app/config/config.yml
          subPath: config.yml
          readOnly: true
        - name: node-logs
          mountPath: /mnt/log
        {{- if .Values.node.encryption.enabled }}
        - name: private-key
          mountPath: /app/encryption
          readOnly: true
        {{- end }}
        {{- range .Values.node.databases.fileBased }}
        - name: database-volume-{{ .name }}
          mountPath: /app/databases/{{ .name }}.{{ .type }}
          {{- with include "node.databaseSubPath" (dict "db" .) }}
          subPath: {{ . }}
          {{- end }}
          {{- if eq (default "ro" .mount_mode) "ro" }}
          readOnly: true
          {{- end }}
        {{- end }}
      volumes:
      - name: task-files-root
        persistentVolumeClaim:
          claimName: {{ include "node.taskClaimName" . }}
      - name: config-volume
        configMap:
          name: {{ .Release.Name }}-configmap
      - name: node-logs
        {{- if .Values.node.logging.persistent }}
        persistentVolumeClaim:
          claimName: {{ include "node.logsClaimName" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.node.encryption.enabled }}
      # Secret is created by `v6 node create-private-key` (not by this chart). This
      # means secret is kept when the node is stopped (but deleted by `v6 node remove`).
      - name: private-key
        secret:
          secretName: {{ .Release.Name }}-private-key
          defaultMode: 0400
          items:
          - key: private_key.pem
            path: private_key.pem
      {{- end }}
      {{- range .Values.node.databases.fileBased }}
      - name: database-volume-{{ .name }}
        persistentVolumeClaim:
          claimName: {{ include "node.databaseClaimName" (dict "releaseName" $.Release.Name "db" .) }}
      {{- end }}
