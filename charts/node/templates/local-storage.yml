{{- /* Development only: the class used by the host path volumes on Docker Desktop. */}}
{{- if and
    (eq (.Values.node.k8sNodeName | default "") "docker-desktop")
    (or (include "node.tasksStatic" .) (include "node.logsStatic" .) (include "node.databasesStatic" .))
    (not (lookup "storage.k8s.io/v1" "StorageClass" "" "local-storage"))
}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
{{- end }}
