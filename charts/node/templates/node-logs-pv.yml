{{- /* Development only: log files in a directory on one machine. */}}
{{- if and .Values.node.logging.persistent (include "node.logsStatic" .) (not (lookup "v1" "PersistentVolume" "" (printf "%s-logs-pv" .Release.Name))) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-logs-pv
  labels:
{{ include "node.labels" . | indent 4 }}
    type: local-logs
    app: vantage6-node
spec:
  capacity:
    storage: {{ .Values.node.logging.storageSize | default "128M" }}
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.node.logging.storageClass | default "local-storage" }}
  persistentVolumeReclaimPolicy: Retain
  local:
    path: {{ .Values.node.logging.volumeHostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ required "node.k8sNodeName is required with logging.volumeHostPath" .Values.node.k8sNodeName }}
{{- end }}
