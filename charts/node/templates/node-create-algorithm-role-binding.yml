apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-create-tasks-rb
  namespace: {{ include "node.namespace" . }}
  labels:
    {{- include "node.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "node.serviceAccountName" . }}
  namespace: {{ include "node.namespace" . }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-create-tasks-role
  apiGroup: rbac.authorization.k8s.io
