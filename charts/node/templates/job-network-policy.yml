{{- if .Values.node.networkPolicy.enabled }}
{{- $namespace := include "node.namespace" . }}
{{- $algorithmPodLabels := include "node.algorithmPodLabels" . }}
{{- $whitelist := .Values.node.whitelist | default dict }}
# The node pod may reach HQ and the Kubernetes API.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-proxy-policy
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
{{ include "node.podLabels" . | indent 6 }}
  policyTypes:
    - Egress
  egress:
    - {}

---

# Default for every pod the node starts for algorithm runs: no traffic in or out.
# Other workloads in the namespace are not affected.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-tasks-default-policy
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
{{ $algorithmPodLabels | indent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

---

# central_compute pods talk to HQ through the node proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-central-compute-policy
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
{{ $algorithmPodLabels | indent 6 }}
      # Must match the corresponding AlgorithmStepType enum value
      role: central_compute
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
{{ include "node.podLabels" . | indent 10 }}
    ports:
    # numberOfNodes and nodeProxyStartingPortNumber are only set in the dev environment
    # (devspace), where several nodes share one pod.
  {{- if and (hasKey .Values.node "numberOfNodes") (hasKey .Values.node "nodeProxyStartingPortNumber") }}
    {{- $start := int .Values.node.nodeProxyStartingPortNumber }}
    {{- $count := int .Values.node.numberOfNodes }}
    {{- range $i, $ := until $count }}
      - protocol: TCP
        port: {{ add $start $i }}
    {{- end }}
  {{- else }}
      - protocol: TCP
        port: {{ .Values.node.proxyPort }}
  {{- end }}
  # DNS, to resolve the address of the node proxy
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.node.networkPolicy.dns.namespace }}
    ports:
    {{- range .Values.node.networkPolicy.dns.ports }}
    - protocol: UDP
      port: {{ . }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- if and (hasKey $whitelist "central_compute") (hasKey $whitelist.central_compute "egress") }}
  - to:
{{ $whitelist.central_compute.egress | toYaml | indent 4 }}
  {{- end }}

{{- /* Optional egress for the other algorithm steps. */}}
{{- range $step := list "data_extraction" "preprocessing" "federated_compute" "postprocessing" }}
{{- if and (hasKey $whitelist $step) (hasKey (index $whitelist $step) "egress") }}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $step | replace "_" "-" }}-policy
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
{{ $algorithmPodLabels | indent 6 }}
      # Must match the corresponding AlgorithmStepType enum value
      role: {{ $step }}
  policyTypes:
  - Egress
  egress:
  - to:
{{ (index $whitelist $step).egress | toYaml | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
