{{- if and (eq (include "node.taskNamespaceOwnedByOtherRelease" .) "true") .Values.node.production }}
{{ fail (printf `node.taskNamespace '%s' already exists and is owned by another Helm
release, not this one ('%s'). node.production is true, so this is refused rather than
silently sharing a task namespace between node deployments.

Set a unique 'node.taskNamespace' value for this release, or set node.production=false if
this is an intentional shared/development setup.` .Values.node.taskNamespace .Release.Name) }}
{{- end }}
{{- if .Values.node.manageTaskNamespace }}
# Owning the task namespace here (rather than relying on the node process to create it on
# first boot, as it did before) lets the Role/RoleBinding below be scoped to this namespace
# instead of needing cluster-wide permissions to reach it.
#
# Helm always creates Namespace resources before Role/RoleBinding/other kinds in the same
# release, so this is guaranteed to exist by the time anything below needs it - no
# install-order hooks required.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.node.taskNamespace }}
  labels:
{{- include "node.labels" . | nindent 4 }}
  annotations:
    # Don't delete a namespace that may still hold running task pods/jobs (or another
    # release's, if shared) just because this release is uninstalled.
    "helm.sh/resource-policy": keep
{{- end }}
