{{- /* Development only: file-based databases in a directory on one machine. */}}
{{- range .Values.node.databases.fileBased }}
{{- if and .volumePath (not .existingClaim) }}
{{- $pvName := include "node.databasePvName" (dict "releaseName" $.Release.Name "databaseName" .name) }}
{{- if not (lookup "v1" "PersistentVolume" "" $pvName) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pvName }}
  labels:
    type: local-database
    database: {{ .name | quote }}
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Delete
  local:
    path: {{ .volumePath | quote }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ required "node.k8sNodeName is required for databases with volumePath" $.Values.node.k8sNodeName }}
{{- end }}
{{- end }}
{{- end }}
