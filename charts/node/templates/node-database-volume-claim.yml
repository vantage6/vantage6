{{- /* Development only: claims on top of the host path database volumes. */}}
{{- range .Values.node.databases.fileBased }}
{{- if and .volumePath (not .existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "node.databasePvcName" (dict "releaseName" $.Release.Name "databaseName" .name) }}
  namespace: {{ include "node.namespace" $ }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      type: local-database
      database: {{ .name | quote }}
{{- end }}
{{- end }}
