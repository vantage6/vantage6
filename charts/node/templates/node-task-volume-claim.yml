apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-task-pvc
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.node.persistence.tasks.size }}
  storageClassName: {{ .Values.node.persistence.tasks.storageClass }}
  selector:
    matchLabels:
      type: local-tasks