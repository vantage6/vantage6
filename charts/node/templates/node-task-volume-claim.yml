{{- if not .Values.node.persistence.tasks.existingClaim }}
{{- $static := include "node.tasksStatic" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "node.taskClaimName" . }}
  namespace: {{ include "node.namespace" . }}
  labels:
{{- include "node.labels" . | nindent 4 }}
  annotations:
    # Sessions and results must survive a restart of the node.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ if $static }}ReadWriteOnce{{ else }}{{ .Values.node.persistence.tasks.accessMode }}{{ end }}
  resources:
    requests:
      storage: {{ .Values.node.persistence.tasks.size }}
  {{- if $static }}
  storageClassName: {{ .Values.node.persistence.tasks.storageClass | default "local-storage" }}
  selector:
    matchLabels:
      type: local-tasks
  {{- else if .Values.node.persistence.tasks.storageClass }}
  storageClassName: {{ .Values.node.persistence.tasks.storageClass }}
  {{- end }}
{{- end }}
