keycloak:

  standalone: true

  instances: 1
  hostname: ""

  behindGateway:
    enabled: false
    proxyHeaders: xforwarded
    httpPort: 7680

  # note that dependent on the production setting, the users and secrets that are
  # set are different - for non-production, they are set to simple, non-secure values.
  production: true
  tls:
    enabled: true
    autoGenerated: true

  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 500m

  realmImport:
    enabled: true
    # Ensures the KeycloakRealmImport CR is only applied once the Keycloak CR reports
    # Ready, via a post-install hook Job. Prevents a race on fresh installs where the
    # realm-import controller reconciles before the Keycloak StatefulSet exists and
    # never gets requeued once it comes up.
    waitForKeycloak:
      enabled: true
      image: rancher/kubectl:v1.31.0
      # Keep below Helm's --timeout (default 5m): the release aborts on that budget
      # first, so raising this without also raising --timeout has no effect.
      timeout: 300s
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    passwordPolicy: "length(8) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)"
    resetPasswordAllowed: false
    verifyEmail: false
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 5
    smtpServer:
      # placeholder for SMTP server configuration
    publicClient:
      name: public_client


# PostgreSQL configuration for Keycloak
database:
  external: true
  host: ""
  username: ""
  password: ""
  name: ""
