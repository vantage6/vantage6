{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $keycloakAdminExistingSecret := .Values.keycloak.auth.adminUserSecret | default "" }}
{{- $keycloakAdminSecretName := ($keycloakAdminExistingSecret | default (printf "%s-kc-adm-secret" .Release.Name)) }}
{{- $userSpecifiedKCAdminSecret := ne (trim $keycloakAdminExistingSecret) "" }}
{{- $keycloakAdminSecret := lookup "v1" "Secret" $namespace $keycloakAdminSecretName }}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.dbSecretName" . }}
  namespace: {{ $namespace }}
  labels:
{{ include "auth.labels" . | indent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username }}
  password: {{ .Values.database.password | quote }}
{{- end }}
---
{{- if $userSpecifiedKCAdminSecret }}
  {{- if not $keycloakAdminSecret }}
    {{- fail (printf "The secret '%s' specified in keycloak.auth.keycloakAdminExistingSecret was not found in namespace '%s'" $keycloakAdminSecretName $namespace) }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keycloakAdminSecretName }}
  namespace: {{ $namespace }}
  labels:
{{ include "auth.labels" . | indent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.auth.adminUser }}
  password: {{ .Values.keycloak.auth.adminPassword | quote }}
{{- end }}
{{- $realmImport := .Values.keycloak.realmImport }}
{{- if and $realmImport (ne $realmImport.enabled false) (not $realmImport.existingSecret) }}
{{- $globalKeycloak := (.Values.global | default (dict)).keycloak | default (dict) }}
{{- $realmImportAdmin := $realmImport.admin | default (dict) }}
{{- $smtp := $realmImport.smtpServer | default (dict) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.realmSecretName" . }}
  namespace: {{ $namespace }}
  labels:
{{ include "auth.labels" . | indent 4 }}
type: Opaque
stringData:
  admin-password: {{ default $globalKeycloak.adminPassword $realmImportAdmin.password | quote }}
  backend-client-secret: {{ default $globalKeycloak.adminClientSecret $realmImport.backend_client_secret | quote }}
  {{- if $smtp.password }}
  smtp-password: {{ $smtp.password | quote }}
  {{- end }}
{{- end }}
