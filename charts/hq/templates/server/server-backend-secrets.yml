{{- if not .Values.hq.existingSecret }}
{{- $global := .Values.global | default (dict) }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $secretName := include "vantage6.secretName" . }}
{{- $jwtSecret := "" }}
{{- if and .Values.hq.jwt .Values.hq.jwt.secret }}
{{- $jwtSecret = .Values.hq.jwt.secret }}
{{- else }}
{{- $existing := lookup "v1" "Secret" $namespace $secretName }}
{{- if and $existing $existing.data $existing.data.V6_JWT_SECRET_KEY }}
{{- $jwtSecret = b64dec $existing.data.V6_JWT_SECRET_KEY }}
{{- else }}
{{- $jwtSecret = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
type: Opaque
data:
  KEYCLOAK_ADMIN_USERNAME: {{ (default $global.keycloak .Values.hq.keycloak).adminUsername | b64enc }}
  KEYCLOAK_ADMIN_PASSWORD: {{ (default $global.keycloak .Values.hq.keycloak).adminPassword | b64enc }}
  KEYCLOAK_ADMIN_CLIENT: {{ (default $global.keycloak .Values.hq.keycloak).adminClient | b64enc }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ (default $global.keycloak .Values.hq.keycloak).adminClientSecret | b64enc }}
  V6_JWT_SECRET_KEY: {{ $jwtSecret | b64enc }}
  {{- if .Values.database.external }}
  V6_DATABASE_URI: {{ .Values.database.uri | b64enc }}
  {{- else }}
  V6_DATABASE_URI: {{ printf "postgresql://%s:%s@%s-hq-postgres:5432/%s" (.Values.database.username | urlquery) (.Values.database.password | urlquery) .Release.Name .Values.database.name | b64enc }}
  DATABASE_PASSWORD: {{ .Values.database.password | b64enc }}
  {{- end }}
  {{- if .Values.rabbitmq }}
  V6_RABBITMQ_URI: {{ printf "amqp://%s:%s@%s-rabbitmq:5672/%s" (.Values.rabbitmq.username | urlquery) (.Values.rabbitmq.password | urlquery) .Release.Name (.Values.rabbitmq.vhost | urlquery) | b64enc }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | b64enc }}
  {{- end }}
  {{- with .Values.hq.large_result_store }}
  {{- if .connection_string }}
  V6_LARGE_RESULT_STORE_CONNECTION_STRING: {{ .connection_string | b64enc }}
  {{- end }}
  {{- if .client_secret }}
  V6_LARGE_RESULT_STORE_CLIENT_SECRET: {{ .client_secret | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
