{{- $global := .Values.global | default (dict) }}
{{- if and (.Values.prometheus.enabled) (ne (.Values.database.k8sNodeName | default $global.k8sNodeName) "") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prom-pvc
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
{{ include "vantage6.labels" . | indent 4 }}
    component: prometheus-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheus.storageSize | default "2Gi" }}
  {{- if .Values.prometheus.storageClass }}
  storageClassName: {{ .Values.prometheus.storageClass }}
  {{- end }}
  selector:
    matchLabels:
      type: prometheus-data
      app: {{ include "vantage6.name" . }}
{{- end }}
