hq:
  enabled: true

auth:
  enabled: true

store:
  enabled: true

hubGateway:
  enabled: false

  # Serve all components on this single hostname, separated by path: /auth (Keycloak),
  # the HQ API path (default /hq) and /socket.io (HQ), the store API path and / (UI).
  # Use either this or `hosts`, not both. The store API path (store.store.api_path) must
  # then differ from /store, as the UI uses /store/... for its own pages.
  host: ""

  # Hostname per component (one subdomain per component)
  hosts:
    auth: ""
    hq: ""
    portal: ""
    store: ""

  tls:
    mode: cert-manager

    existingSecrets:
      auth: ""
      hq: ""
      portal: ""
      store: ""
      # TLS secret for `host`, if that is used
      hub: ""

  certManager:
    enabled: true
    clusterIssuer: letsencrypt-prod

global:
  keycloak:
    url: ""
    realm: "vantage6"
    hqAdminClient: "hq-admin-client"
    publicClient: "public_client"
    hqStoreReaderClient: "hq-store-reader-client"
    storeAdminClient: "store-admin-client"
  urls:
    external:
      auth: ""
      store: ""
      ui: ""
      hq: ""
    internal:
      auth: ""
      store: ""
      ui: ""
      hq: ""
  k8sNodeName: ""

  wait:
    auth:
      enabled: true
      maxAttempts: 60
      intervalSeconds: 5
    store:
      enabled: true
      maxAttempts: 60
      intervalSeconds: 5
