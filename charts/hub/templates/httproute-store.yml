{{- $hg := .Values.hubGateway | default (dict) -}}
{{- $hosts := $hg.hosts | default (dict) -}}
{{- $singleHost := include "hub.singleHost" . -}}
{{- $storeHost := $singleHost | default (get $hosts "store" | default "") -}}
{{- $storeValues := .Values.store | default (dict) -}}
{{- $storeCfg := $storeValues.store | default (dict) -}}
{{- $storePort := $storeCfg.port | default 7602 -}}
{{- if and ($hg.enabled | default false) (ne (trim $storeHost) "") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-store-route
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: {{ ternary "hub" "store" (ne $singleHost "") }}
  hostnames:
    - {{ $storeHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ ternary (include "hub.storeApiPath" .) "/" (ne $singleHost "") }}
      backendRefs:
        - name: {{ .Release.Name }}-store
          port: {{ $storePort }}
{{- end }}
