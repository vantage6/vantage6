{{- $hg := .Values.hubGateway | default (dict) -}}
{{- $hosts := $hg.hosts | default (dict) -}}
{{- $singleHost := include "hub.singleHost" . -}}
{{- $hqHost := $singleHost | default (get $hosts "hq" | default "") -}}
{{- $hqValues := .Values.hq | default (dict) -}}
{{- $hqCfg := $hqValues.hq | default (dict) -}}
{{- $hqPort := $hqCfg.port | default 7601 -}}
{{- if and ($hg.enabled | default false) (ne (trim $hqHost) "") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-hq-route
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: {{ ternary "hub" "hq" (ne $singleHost "") }}
  hostnames:
    - {{ $hqHost | quote }}
  rules:
    - matches:
        {{- if ne $singleHost "" }}
        - path:
            type: PathPrefix
            value: {{ include "hub.hqApiPath" . }}
        # The websocket endpoint of HQ is served at the root, not under the API path
        - path:
            type: PathPrefix
            value: /socket.io
        {{- else }}
        - path:
            type: PathPrefix
            value: /
        {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}-hq
          port: {{ $hqPort }}
{{- end }}
