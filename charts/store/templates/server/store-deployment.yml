apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-store
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
{{ include "store.labels" . | indent 4 }}
    component: store
spec:
  replicas: {{ .Values.store.replications }}
  selector:
    matchLabels:
{{ include "store.matchLabels" . | indent 6 }}
      component: store
  template:
    metadata:
      labels:
{{ include "store.labels" . | indent 8 }}
        component: store
    spec:
      {{- $global := .Values.global | default (dict) }}
      {{- $urls := $global.urls | default (dict) }}
      {{- $internal := $urls.internal | default (dict) }}
      {{- $wait := $global.wait | default (dict) }}
      {{- $waitAuth := $wait.auth | default (dict) }}
      {{- $authUrl := $internal.auth | default "" }}
      {{- if and ($waitAuth.enabled | default false) (ne (trim $authUrl) "") }}
      initContainers:
        - name: wait-for-auth
          image: {{ $waitAuth.image | default "dhi.io/curl:8-alpine" }}
          command:
            - curl
          args:
{{- include "common.waitForComponentReadyArgs" (dict "url" $authUrl "label" "Auth" "maxAttempts" ($waitAuth.maxAttempts | default 60) "intervalSeconds" ($waitAuth.intervalSeconds | default 5)) | nindent 12 }}
      {{- end }}
      {{- $storeKeycloak := default (dict) .Values.store.keycloak }}
      containers:
      - name: vantage6-store-backend
        image: {{ .Values.store.image }}
        imagePullPolicy: {{ .Values.store.imagePullPolicy | default "Always" }}
        env:
        - name: KEYCLOAK_URL
          value: {{ default $internal.auth $storeKeycloak.url }}
        - name: KEYCLOAK_REALM
          value: {{ (default ($global.keycloak | default (dict)) .Values.store.keycloak).realm }}
        - name: VANTAGE6_CONFIG_LOCATION
          value: /mnt/config.yaml
        - name: V6_PROXY_PORT
          value: "{{ .Values.store.internal.port }}"
        - name: UWSGI_GEVENT
          value: "1000"
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-store-secrets
        ports:
        - containerPort: {{ .Values.store.internal.port }}
        command:
          - /vantage6/vantage6-algorithm-store/server.sh
        volumeMounts:
        - name: config-file
          mountPath: /mnt/config.yaml
          subPath: config.yaml
        {{- if and
        (eq .Values.store.logging.storageClass "local-storage")
        (ne (.Values.database.k8sNodeName | default $global.k8sNodeName) "")
        }}
        - name: store-logs
          mountPath: /mnt/log
        {{- end }}
      volumes:
      - name: config-file
        configMap:
          name: {{ .Release.Name }}-store-configmap
      # Note that logs are not stored if no local k8s node is available
      {{- if ne (.Values.database.k8sNodeName | default $global.k8sNodeName) "" }}
      - name: store-logs
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-store-logs-pvc
      {{- end }}