{{- if .Values.store.existingSecret }}
{{- if or .Values.database.uri .Values.database.password (.Values.store.smtpServer | default (dict)).password .Values.store.private_docker_registries }}
{{- fail "store.existingSecret is set: provide the database URI and password, SMTP password and private Docker registries in that secret instead of in the values" }}
{{- end }}
{{- end }}
{{- if not .Values.store.existingSecret }}
{{- $global := .Values.global | default (dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.secretName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
type: Opaque
data:
  KEYCLOAK_ADMIN_PASSWORD: {{
    (default $global.keycloak .Values.store.keycloak).adminPassword | b64enc
  }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{
    (default $global.keycloak .Values.store.keycloak).adminClientSecret | b64enc
  }}
  {{- if .Values.database.external }}
  V6_DATABASE_URI: {{ .Values.database.uri | b64enc }}
  {{- else }}
  V6_DATABASE_URI: {{ printf "postgresql://%s:%s@%s-store-postgres:5432/%s" (.Values.database.username | urlquery) (.Values.database.password | urlquery) .Release.Name .Values.database.name | b64enc }}
  DATABASE_PASSWORD: {{ .Values.database.password | b64enc }}
  {{- end }}
  {{- if and .Values.store.smtpServer .Values.store.smtpServer.password }}
  V6_SMTP_PASSWORD: {{ .Values.store.smtpServer.password | b64enc }}
  {{- end }}
  {{- if .Values.store.private_docker_registries }}
  V6_PRIVATE_DOCKER_REGISTRIES: {{ .Values.store.private_docker_registries | toJson | b64enc }}
  {{- end }}
{{- end }}
