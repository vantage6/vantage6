{{- $global := .Values.global | default (dict) }}
{{- if not (lookup "v1" "Secret" (.Values.namespace | default .Release.Namespace) (printf "%s-store-secrets" .Release.Name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-store-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  # The store's own Keycloak client, which can only look up users
  KEYCLOAK_ADMIN_CLIENT: {{ (default $global.keycloak .Values.store.keycloak).storeAdminClient | default "store-admin-client" | b64enc }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{
    required "keycloak.storeAdminClientSecret is required"
      (default $global.keycloak .Values.store.keycloak).storeAdminClientSecret
    | b64enc
  }}
{{- end }}
