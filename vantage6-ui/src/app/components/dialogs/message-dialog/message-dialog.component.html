<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="mat-typography confirm-dialog-content">
  @for (paragraph of data.content; track paragraph) {
    <div>
      <p>{{ paragraph }}</p>
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close color="{{ data.confirmButtonType || 'primary' }}" [mat-dialog-close]="true">
    {{ data.confirmButtonText || "general.confirm" | translate }}
  </button>
</mat-dialog-actions>
