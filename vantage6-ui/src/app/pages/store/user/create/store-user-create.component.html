<app-page-header title="{{ 'user-create.title' | translate }}"></app-page-header>
@if (!isSubmitting) {
  <mat-card>
    <mat-card-content>
      <app-store-user-form (submitted)="handleSubmit($event)" (cancelled)="handleCancel()"></app-store-user-form>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
