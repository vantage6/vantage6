@if (!isLoading && !isSubmitting && user) {
  <app-page-header [title]="getTitle()"></app-page-header>
  <mat-card>
    <mat-card-content>
      <app-store-user-form [user]="user" (submitted)="handleSubmit($event)" (cancelled)="handleCancel()"></app-store-user-form>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
