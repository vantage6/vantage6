@if (!isLoading && !isSubmitting && algorithm) {
  <app-page-header [title]="algorithm.name"></app-page-header>
  <app-algorithm-form [algorithm]="algorithmForm" (submitted)="handleSubmit($event)" (cancelled)="handleCancel()"></app-algorithm-form>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
