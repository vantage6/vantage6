<app-page-header title="{{ 'algorithm-create.title' | translate }}"></app-page-header>
@if (!isSubmitting) {
  <app-algorithm-form (submitted)="handleSubmit($event)" (cancelled)="handleCancel()"></app-algorithm-form>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
