@if (!isLoading && !isSubmitting && collaboration) {
  <app-page-header [title]="collaboration.name"></app-page-header>
  <mat-card>
    <mat-card-content>
      <app-collaboration-form
        [collaboration]="collaboration"
        (submitted)="handleSubmit($event)"
        (cancelled)="handleCancel()"
      ></app-collaboration-form>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
