<app-page-header title="{{ 'collaboration-create.title' | translate }}"></app-page-header>
@if (!isSubmitting) {
  <mat-card>
    <mat-card-content>
      <app-collaboration-form (submitted)="handleSubmit($event)" (cancelled)="handleCancel()"></app-collaboration-form>
    </mat-card-content>
  </mat-card>
} @else {
  <mat-card>
    <mat-card-content>
      <mat-spinner diameter="48"></mat-spinner>
    </mat-card-content>
  </mat-card>
}
