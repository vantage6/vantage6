<app-page-header title="{{ 'organization-list.title' | translate }}">
  @if (canCreate) {
    <button actions mat-flat-button color="primary" [routerLink]="routes.organizationCreate">
      <mat-icon>add</mat-icon>{{ "organization-create.title" | translate }}
    </button>
  }
</app-page-header>
<mat-card>
  <mat-card-content>
    <app-table
      [data]="table"
      (rowClick)="handleTableClick($event)"
      [isLoading]="isLoading"
      (searchChanged)="handleSearchChanged($event)"
    ></app-table>
    <mat-paginator
      (page)="handlePageEvent($event)"
      [length]="$safeNavigationMigration(pagination?.total)"
      pageSize="10"
      [hidePageSize]="true"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
